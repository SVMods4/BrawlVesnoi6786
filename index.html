<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brawl Stars 3D Viewer</title>
  <style>
    @font-face {
      font-family: 'Pusia';
      src: url('Pusia-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b1426;
      overflow: hidden;
      font-family: 'Pusia', 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Brawler bar */
    #brawler-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 20;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brawler-btn {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: 3px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
      padding: 0;
    }

    .brawler-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brawler-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.15);
    }

    .brawler-btn.active {
      border-color: #ffd700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.35),
                  0 0 20px rgba(255, 215, 0, 0.4);
      transform: scale(1.1);
    }

    .brawler-btn:active {
      transform: scale(0.96);
    }

    /* Menu button */
    #menu-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Pusia', sans-serif;
      font-size: 14px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    #menu-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: #ffd700;
      transform: scale(1.05);
    }

    /* Menu panel */
    #menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      max-width: 90vw;
      height: 100%;
      background: rgba(15, 20, 40, 0.95);
      backdrop-filter: blur(16px);
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      border-left: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
    }

    #menu-panel.open {
      transform: translateX(0);
    }

    .menu-header {
      padding: 20px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .menu-header h2 {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .menu-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.7;
      line-height: 1;
    }

    .menu-close:hover {
      opacity: 1;
    }

    .menu-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .menu-section {
      margin-bottom: 28px;
    }

    .menu-section h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 12px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-family: 'Pusia', sans-serif;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: rgba(255, 215, 0, 0.15);
      border-color: #ffd700;
    }

    .download-btn img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
    }

    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: #ffd700;
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.4);
    }

    .menu-footer {
      padding: 16px 20px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .menu-footer img {
      width: 56px;
      height: 56px;
    }

    .menu-footer span {
      font-size: 12px;
      letter-spacing: 1.5px;
      opacity: 0.85;
    }

    /* Loading */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1426;
      z-index: 50;
      gap: 16px;
    }

    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #hint {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
    }

    /* Overlay when menu open */
    #menu-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #menu-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Загрузка...</div>
  </div>

  <div id="hint">ЛКМ — вращать · Колёсико — масштаб</div>

  <button id="menu-btn">МЕНЮ</button>

  <div id="menu-overlay"></div>

  <div id="menu-panel">
    <div class="menu-header">
      <h2>МЕНЮ</h2>
      <button class="menu-close" id="menu-close">×</button>
    </div>

    <div class="menu-content">
      <div class="menu-section">
        <h3>Скачать модели</h3>
        <button class="download-btn" data-download="colt">
          <img src="colt.webp" alt="Colt" />
          <span>Colt</span>
        </button>
        <button class="download-btn" data-download="shelly">
          <img src="shelly.webp" alt="Shelly" />
          <span>Shelly</span>
        </button>
      </div>

      <div class="menu-section">
        <h3>Цвет фона</h3>
        <div class="color-row" id="color-row">
          <div class="color-swatch active" data-color="#0b1426" style="background:#0b1426"></div>
          <div class="color-swatch" data-color="#1a1a2e" style="background:#1a1a2e"></div>
          <div class="color-swatch" data-color="#16213e" style="background:#16213e"></div>
          <div class="color-swatch" data-color="#0f3460" style="background:#0f3460"></div>
          <div class="color-swatch" data-color="#1b4332" style="background:#1b4332"></div>
          <div class="color-swatch" data-color="#3d0c11" style="background:#3d0c11"></div>
          <div class="color-swatch" data-color="#2d1b4e" style="background:#2d1b4e"></div>
          <div class="color-swatch" data-color="#111111" style="background:#111111"></div>
        </div>
      </div>
    </div>

    <div class="menu-footer">
      <img src="star.webp" alt="Star" />
      <span>BY BURMALDA STARS</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="brawler-bar">
    <button class="brawler-btn" data-brawler="shelly" title="Shelly">
      <img src="shelly.webp" alt="Shelly" />
    </button>
    <button class="brawler-btn active" data-brawler="colt" title="Colt">
      <img src="colt.webp" alt="Colt" />
    </button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const menuBtn = document.getElementById('menu-btn');
    const menuPanel = document.getElementById('menu-panel');
    const menuClose = document.getElementById('menu-close');
    const menuOverlay = document.getElementById('menu-overlay');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1426);
    scene.fog = new THREE.Fog(0x0b1426, 25, 70);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 6, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x223355, 1.15);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
    key.position.set(6, 14, 9);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.7);
    fill.position.set(-8, 5, -5);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffaa66, 0.9);
    rim.position.set(0, 4, -12);
    scene.add(rim);

    // Ground
    const groundGeo = new THREE.CircleGeometry(14, 64);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x152238,
      roughness: 0.92,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    scene.add(ground);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 4;
    controls.maxDistance = 45;
    controls.target.set(0, 4, 0);
    controls.update();

    // Brawlers (Spike removed)
    const brawlers = {
      colt:  { path: 'colt.glb' },
      shelly:{ path: 'shelly.glb' }
    };

    let currentModel = null;
    let currentName = null;
    const loader = new GLTFLoader();
    const cache = {};

    function showLoading(text = 'Загрузка...') {
      loadingText.textContent = text;
      loadingEl.classList.remove('hidden');
    }

    function hideLoading() {
      loadingEl.classList.add('hidden');
    }

    function clearCurrentModel() {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse((child) => {
          if (child.isMesh) {
            child.geometry?.dispose();
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material?.dispose();
            }
          }
        });
        currentModel = null;
      }
    }

    function fitModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      const targetHeight = 10.5;
      const currentHeight = size.y;
      if (currentHeight > 0.01) {
        const s = targetHeight / currentHeight;
        model.scale.setScalar(s);
        const box2 = new THREE.Box3().setFromObject(model);
        model.position.y -= box2.min.y;
      }

      const finalBox = new THREE.Box3().setFromObject(model);
      return finalBox.getSize(new THREE.Vector3());
    }

    async function loadBrawler(name) {
      if (name === currentName) return;
      showLoading('Загрузка...');

      document.querySelectorAll('.brawler-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.brawler === name);
      });

      try {
        let gltf;
        if (cache[name]) {
          gltf = cache[name];
        } else {
          gltf = await new Promise((resolve, reject) => {
            loader.load(
              brawlers[name].path,
              resolve,
              (xhr) => {
                if (xhr.total) {
                  const pct = Math.round((xhr.loaded / xhr.total) * 100);
                  loadingText.textContent = `Загрузка... ${pct}%`;
                }
              },
              reject
            );
          });
          cache[name] = gltf;
        }

        clearCurrentModel();
        const model = gltf.scene.clone(true);
        const size = fitModel(model);
        scene.add(model);

        currentModel = model;
        currentName = name;

        const height = Math.max(size.y, 1);
        const targetY = height * 0.42;
        controls.target.set(0, targetY, 0);
        const dist = Math.max(height * 2.4, 16);
        camera.position.set(0, targetY + height * 0.28, dist);
        controls.update();

        hideLoading();
      } catch (err) {
        console.error(err);
        loadingText.textContent = 'Ошибка загрузки';
        setTimeout(hideLoading, 1500);
      }
    }

    // Menu
    function openMenu() {
      menuPanel.classList.add('open');
      menuOverlay.classList.add('visible');
    }

    function closeMenu() {
      menuPanel.classList.remove('open');
      menuOverlay.classList.remove('visible');
    }

    menuBtn.addEventListener('click', openMenu);
    menuClose.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);

    // Downloads
    document.querySelectorAll('[data-download]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.download;
        const path = brawlers[name]?.path;
        if (!path) return;

        // Create a temporary link to download the GLB
        const a = document.createElement('a');
        a.href = path;
        a.download = `${name}.glb`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    });

    // Background colors
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        const color = swatch.dataset.color;
        scene.background = new THREE.Color(color);
        scene.fog.color = new THREE.Color(color);
        // Slightly adjust ground
        const c = new THREE.Color(color);
        c.offsetHSL(0, 0, -0.05);
        ground.material.color = c;
      });
    });

    // Brawler buttons
    document.querySelectorAll('.brawler-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        loadBrawler(btn.dataset.brawler);
      });
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start
    loadBrawler('colt');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
